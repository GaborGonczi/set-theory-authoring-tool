services:
  set-theory-at:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    container_name: set-theory-at-dev
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "8080:8080"
    volumes:
      - ../..:/app
    command: >
      /usr/bin/supervisord -n -c /etc/supervisor/supervisord.conf