services:
  set-theory-at-frontend:
    build:
      context: ../..
      dockerfile: docker/dev/Dockerfile
    container_name: set-theory-at-frontend-dev
    restart: unless-stopped
    ports:
      - "4200:4200"
    volumes:
      - ../..:/app
    command: >
      sh -c "ng serve --host 0.0.0.0 --poll 1000"