server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    charset utf-8;

    # API-kérések továbbítása a Laravel alkalmazás Nginx konténerének.
    # A backend-nginx szolgáltatásnévnek a Docker Compose-ban egyeznie kell.
    location /api/ {
        proxy_pass http://backend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    # Statikus fájlok közvetlen kiszolgálása; Angular útvonalak fallbackje.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~ /\\. {
        deny all;
    }
}